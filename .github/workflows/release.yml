name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 11.3: __version__은 빌드 시 태그에서 주입한다. 태그와 어긋나면 업데이트
      # 배너가 무한 반복되므로 반드시 일치시켜야 한다.
      - name: Inject version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "__version__ = \"$VERSION\"" > app/version.py
          cat app/version.py

      # 12.2: 아이콘은 아직 확보되지 않았다 (REQUIREMENTS.md 15장 미결 사항).
      # 파일이 없으면 --icon 없이 빌드해 CI가 막히지 않도록 한다.
      - name: Build with PyInstaller
        shell: bash
        run: |
          ICON_ARGS=()
          if [ -f "assets/app.ico" ]; then
            ICON_ARGS=(--icon assets/app.ico)
          fi
          pyinstaller --onefile --windowed --name UP-obs "${ICON_ARGS[@]}" \
            --exclude-module PySide6.QtWebEngineCore \
            main.py

      - name: Rename artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv "dist/UP-obs.exe" "dist/UP-obs-v${VERSION}.exe"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${{ github.ref_name }}" \
            "dist/UP-obs-v${VERSION}.exe" \
            --title "${{ github.ref_name }}" \
            --generate-notes
